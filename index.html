<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Collane</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barra nera -->
    <div class="top-bar">
        FREE SHIPPING TO ITALY OVER 110$
    </div>

    <!-- Menu originale -->
    <div class="navbar original">
        <div class="nav-left">MENU</div>
        <div class="nav-center">
            <img src="fotoCollane/logo.png" alt="Logo">
        </div>
        <div class="nav-right">BAG</div>
    </div>

    <!-- Menu clone -->
    <div class="navbar clone">
        <div class="nav-left">MENU</div>
        <div class="nav-center">
            <img src="fotoCollane/logo.png" alt="Logo">
        </div>
        <div class="nav-right">BAG</div>
    </div>

    <!-- Hero principale -->
    <section class="hero">
        <img src="fotoCollane/sfondoIniziale.png" alt="Collane artigianali">
        <div class="hero-text">
            <h1>SPRING '26 - STUDDED JEWERLY AND APPAREL</h1>
        </div>
    </section>
<!-- Sezione Prodotti Chunky -->

<!-- Sezione Prodotti -->
<section class="product-carousel chunky-products">
    <h2>Our Necklaces...</h2>
    <div class="carousel">
        <div class="carousel-track">

            <!-- ORIGINALI -->
            <div class="product-card">
                <img src="fotoCollane/chunky1.jpg">
                <p class="product-name">Chunky Necklace 1</p>
                <p class="product-price">€70</p>
            </div>

            <div class="product-card">
                <img src="fotoCollane/chunky2.jpg">
                <p class="product-name">Chunky Necklace 2</p>
                <p class="product-price">€70</p>
            </div>

            <div class="product-card">
                <img src="fotoCollane/chunky3.jpg">
                <p class="product-name">Chunky Necklace 3</p>
                <p class="product-price">€70</p>
            </div>

            <!-- DUPLICATE -->
            <div class="product-card">
                <img src="fotoCollane/chunky1.jpg">
                <p class="product-name">Chunky Necklace 1</p>
                <p class="product-price">€70</p>
            </div>

            <div class="product-card">
                <img src="fotoCollane/chunky2.jpg">
                <p class="product-name">Chunky Necklace 2</p>
                <p class="product-price">€70</p>
            </div>

            <div class="product-card">
                <img src="fotoCollane/chunky3.jpg">
                <p class="product-name">Chunky Necklace 3</p>
                <p class="product-price">€70</p>
            </div>

        </div>
    </div>
</section>



<section class="hero">
        <img src="fotoCollane/sfondoIniziale.png" alt="Collane artigianali">
        <div class="hero-text">
            <h1>SPRING '26 - STUDDED JEWERLY AND APPAREL</h1>
        </div>
</section>

<script>
    document.querySelectorAll('.carousel').forEach(carousel => {
        const track = carousel.querySelector('.carousel-track');
    
        // Duplica contenuto UNA sola volta
        if (!track.classList.contains('duplicated')) {
            track.innerHTML += track.innerHTML;
            track.classList.add('duplicated');
        }
    
        // PARTENZA DAL CENTRO (fondamentale per scroll infinito)
        const setStartPosition = () => {
            carousel.scrollLeft = track.scrollWidth / 2;
        };
    
        window.addEventListener('load', setStartPosition);
        window.addEventListener('resize', setStartPosition);
    
        let isResetting = false;
    
        carousel.addEventListener('scroll', () => {
            if (isResetting) return;
    
            const scrollLeft = carousel.scrollLeft;
            const halfWidth = track.scrollWidth / 2;
    
            // Scroll verso destra oltre metà
            if (scrollLeft > halfWidth * 1.5) {
                isResetting = true;
                carousel.style.scrollBehavior = 'auto';
                carousel.scrollLeft = scrollLeft - halfWidth;
                setTimeout(() => {
                    carousel.style.scrollBehavior = 'smooth';
                    isResetting = false;
                }, 10);
            }
    
            // Scroll verso sinistra oltre metà
            if (scrollLeft < halfWidth * 0.5) {
                isResetting = true;
                carousel.style.scrollBehavior = 'auto';
                carousel.scrollLeft = scrollLeft + halfWidth;
                setTimeout(() => {
                    carousel.style.scrollBehavior = 'smooth';
                    isResetting = false;
                }, 10);
            }
        });
    });
    </script>


<script>
    let lastScroll = 0;
    const original = document.querySelector('.navbar.original');
    const clone = document.querySelector('.navbar.clone');
    
    window.addEventListener('scroll', () => {
        const currentScroll = window.scrollY;
    
        if (currentScroll > lastScroll) {
            // Scroll giù: nascondi clone e lascia originale trasparente
            clone.classList.remove('show');
            original.style.transform = 'translateY(0)'; // resta nella sua posizione
        } else {
            // Scroll su: mostra il clone
            clone.classList.add('show');
    
            // Se siamo in cima, nascondi clone e originale torna visibile
            if (currentScroll < 50) {
                clone.classList.remove('show');
            }
        }
    
        lastScroll = currentScroll <= 0 ? 0 : currentScroll;
    });
    </script>
</body>

</html>
